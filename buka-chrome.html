<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buka Chrome</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #121212;
      font-family: sans-serif;
    }
    a {
      padding: 18px 36px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <a href="intent://com.android.chrome/#Intent;scheme=android-app;end">Buka Chrome</a>

  <script>
    // Coba buka otomatis; kalau ditahan WebView, tinggal tap tombol di layar
    window.location.href = "intent://com.android.chrome/#Intent;scheme=android-app;end";
  </script>
</body>
</html>
